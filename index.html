<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Сообщения</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="ambient-bg" aria-hidden="true">
  <span class="blob blob-1"></span>
  <span class="blob blob-2"></span>
  <span class="blob blob-3"></span>
</div>

<div class="app-shell" id="appShell">

  <!-- ======================= LIST PANE ======================= -->
  <div class="pane pane-list" id="paneList">
    <section class="screen root-screen active" id="screen-chatlist" data-screen="chatlist">

      <header class="navbar navbar--list">
        <button class="avatar-btn nav-side nav-side--left" id="openSettingsBtn" aria-label="Открыть настройки">
          <span class="avatar avatar--nav" data-avatar="me"></span>
        </button>
        <h1 class="navbar-title">Чаты</h1>
        <button class="glass-circle-btn nav-side nav-side--right" id="openNewChatBtn" aria-label="Новый чат">
          <i class="icon" data-icon="plus"></i>
        </button>
      </header>

      <div class="search-wrap" id="searchWrap">
        <div class="search-bar glass" id="chatSearchBar">
          <i class="icon search-icon" data-icon="search"></i>
          <input type="text" id="chatSearchInput" class="search-input" placeholder="Поиск" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false">
          <button class="search-clear" id="searchClearBtn" aria-label="Очистить" hidden><i class="icon" data-icon="xmarkCircle"></i></button>
        </div>
        <button class="search-cancel" id="searchCancelBtn">Отмена</button>
      </div>

      <div class="chat-list" id="chatList"></div>
      <div class="empty-state" id="chatListEmpty" hidden>
        <i class="icon empty-state-icon" data-icon="search"></i>
        <p>Ничего не найдено</p>
      </div>
    </section>
  </div>

  <!-- ======================= DETAIL PANE ======================= -->
  <div class="pane pane-detail" id="paneDetail">

    <div class="detail-empty" id="detailEmptyState">
      <div class="detail-empty-icon"><i class="icon" data-icon="bubble"></i></div>
      <p>Выберите чат, чтобы начать общение</p>
    </div>

    <!-- ---- Settings ---- -->
    <section class="screen" id="screen-settings" data-screen="settings">
      <header class="navbar navbar--plain">
        <button class="nav-btn nav-side nav-side--left" data-action="pop"><i class="icon" data-icon="chevronLeft"></i><span>Назад</span></button>
        <h1 class="navbar-title">Настройки</h1>
        <span class="nav-side nav-side--right"></span>
      </header>
      <div class="scroll-area">
        <button class="glass-card settings-profile-row" id="settingsProfileRow">
          <span class="avatar avatar--stretch" data-avatar="me"></span>
          <span class="settings-profile-text">
            <span class="settings-profile-name" id="settingsName"></span>
            <span class="settings-profile-tag" id="settingsTag"></span>
          </span>
          <i class="icon chevron-icon" data-icon="chevronRight"></i>
        </button>

        <div class="glass-card settings-group">
          <button class="settings-row" data-detail="privacy">
            <span class="settings-icon settings-icon--teal"><i class="icon" data-icon="lock"></i></span>
            <span class="settings-row-label">Конфиденциальность</span>
            <i class="icon chevron-icon" data-icon="chevronRight"></i>
          </button>
          <button class="settings-row" data-detail="notifications">
            <span class="settings-icon settings-icon--red"><i class="icon" data-icon="bell"></i></span>
            <span class="settings-row-label">Уведомления</span>
            <i class="icon chevron-icon" data-icon="chevronRight"></i>
          </button>
          <button class="settings-row" data-detail="devices">
            <span class="settings-icon settings-icon--gray"><i class="icon" data-icon="laptop"></i></span>
            <span class="settings-row-label">Устройства</span>
            <i class="icon chevron-icon" data-icon="chevronRight"></i>
          </button>
          <button class="settings-row" data-detail="data">
            <span class="settings-icon settings-icon--blue"><i class="icon" data-icon="tray"></i></span>
            <span class="settings-row-label">Данные</span>
            <i class="icon chevron-icon" data-icon="chevronRight"></i>
          </button>
        </div>

        <div class="glass-card settings-group">
          <button class="settings-row" data-detail="appearance">
            <span class="settings-icon settings-icon--purple"><i class="icon" data-icon="palette"></i></span>
            <span class="settings-row-label">Оформление</span>
            <span class="settings-row-value">Тёмная</span>
            <i class="icon chevron-icon" data-icon="chevronRight"></i>
          </button>
          <button class="settings-row" data-detail="grouping">
            <span class="settings-icon settings-icon--orange"><i class="icon" data-icon="stack"></i></span>
            <span class="settings-row-label">Группировка чатов</span>
            <span class="settings-row-value">По времени</span>
            <i class="icon chevron-icon" data-icon="chevronRight"></i>
          </button>
          <button class="settings-row" data-detail="language">
            <span class="settings-icon settings-icon--green"><i class="icon" data-icon="globe"></i></span>
            <span class="settings-row-label">Язык</span>
            <span class="settings-row-value">Русский</span>
            <i class="icon chevron-icon" data-icon="chevronRight"></i>
          </button>
        </div>

        <div class="glass-card settings-group">
          <button class="settings-row" data-detail="support">
            <span class="settings-icon settings-icon--indigo"><i class="icon" data-icon="question"></i></span>
            <span class="settings-row-label">Поддержка</span>
            <i class="icon chevron-icon" data-icon="chevronRight"></i>
          </button>
          <button class="settings-row" data-detail="about">
            <span class="settings-icon settings-icon--gray2"><i class="icon" data-icon="info"></i></span>
            <span class="settings-row-label">О приложении</span>
            <i class="icon chevron-icon" data-icon="chevronRight"></i>
          </button>
        </div>
        <p class="scroll-footer">Мессенджер · версия 26.0</p>
      </div>
    </section>

    <!-- ---- Generic settings detail ---- -->
    <section class="screen" id="screen-detail-generic" data-screen="detail-generic">
      <header class="navbar navbar--plain">
        <button class="nav-btn nav-side nav-side--left" data-action="pop"><i class="icon" data-icon="chevronLeft"></i><span>Назад</span></button>
        <h1 class="navbar-title" id="genericDetailTitle">Раздел</h1>
        <span class="nav-side nav-side--right"></span>
      </header>
      <div class="scroll-area" id="genericDetailContent"></div>
    </section>

    <!-- ---- Self profile (view) ---- -->
    <section class="screen" id="screen-profile-self" data-screen="profile-self">
      <header class="navbar navbar--plain">
        <button class="nav-btn nav-side nav-side--left" data-action="pop"><i class="icon" data-icon="chevronLeft"></i><span>Назад</span></button>
        <h1 class="navbar-title">Профиль</h1>
        <button class="text-btn nav-side nav-side--right" id="editProfileBtn">Изменить</button>
      </header>
      <div class="scroll-area">
        <div class="profile-header">
          <span class="avatar avatar--xl" data-avatar="me"></span>
          <h2 class="profile-name" id="selfProfileName"></h2>
          <p class="profile-tag" id="selfProfileTag"></p>
        </div>

        <div class="glass-card track-card" id="selfTrackCard">
          <span class="track-art"><i class="icon" data-icon="music"></i></span>
          <span class="track-info">
            <span class="track-title" id="selfTrackTitle"></span>
            <span class="track-artist" id="selfTrackArtist"></span>
          </span>
          <button class="track-play" id="selfTrackPlay"><i class="icon" data-icon="play"></i></button>
        </div>

        <div class="glass-card info-card">
          <div class="info-row"><span class="info-label">Телефон</span><span class="info-value" id="sPhone"></span></div>
          <div class="info-row"><span class="info-label">Тег</span><span class="info-value" id="sTag"></span></div>
          <div class="info-row"><span class="info-label">Дата рождения</span><span class="info-value" id="sBirthday"></span></div>
          <div class="info-row info-row--multiline"><span class="info-label">О себе</span><span class="info-value" id="sBio"></span></div>
        </div>

        <button class="share-btn" id="shareProfileBtn"><i class="icon" data-icon="share"></i><span>Поделиться</span></button>
      </div>
    </section>

    <!-- ---- Self profile edit ---- -->
    <section class="screen" id="screen-profile-edit" data-screen="profile-edit">
      <header class="navbar navbar--plain">
        <button class="text-btn nav-side nav-side--left" id="editCancelBtn">Отмена</button>
        <h1 class="navbar-title">Изменить профиль</h1>
        <button class="text-btn text-btn--accent nav-side nav-side--right" id="editDoneBtn">Готово</button>
      </header>
      <div class="scroll-area">
        <div class="edit-avatar-wrap">
          <button class="avatar avatar--xl edit-avatar-btn" id="editAvatarBtn" data-avatar="me">
            <span class="edit-avatar-badge"><i class="icon" data-icon="camera"></i></span>
          </button>
        </div>
        <div class="glass-card edit-card">
          <label class="edit-row"><span class="edit-label">Имя</span><input class="edit-input" id="editName" type="text" autocomplete="off"></label>
          <label class="edit-row"><span class="edit-label">О себе</span><input class="edit-input" id="editBio" type="text" autocomplete="off"></label>
          <label class="edit-row"><span class="edit-label">Рождение</span><input class="edit-input" id="editBirthday" type="text" autocomplete="off"></label>
          <label class="edit-row"><span class="edit-label">Телефон</span><input class="edit-input" id="editPhone" type="text" autocomplete="off"></label>
          <label class="edit-row"><span class="edit-label">Тег</span><input class="edit-input" id="editTag" type="text" autocomplete="off"></label>
        </div>
      </div>
    </section>

    <!-- ---- Chat conversation ---- -->
    <section class="screen" id="screen-chat" data-screen="chat">
      <header class="navbar navbar--chat">
        <button class="nav-btn nav-side nav-side--left" data-action="pop"><i class="icon" data-icon="chevronLeft"></i><span>Назад</span></button>
        <button class="chat-title-btn" id="chatTitleBtn">
          <span class="chat-title-name" id="chatHeaderName"></span>
          <span class="chat-title-status" id="chatHeaderStatus"></span>
        </button>
        <button class="avatar-btn nav-side nav-side--right" id="chatHeaderAvatarBtn" aria-label="Открыть аватар">
          <span class="avatar avatar--nav" id="chatHeaderAvatar"></span>
        </button>
      </header>

      <div class="chat-messages" id="chatMessages"></div>

      <div class="input-bar">
        <button class="glass-circle-btn input-attach" id="attachBtn" aria-label="Прикрепить"><i class="icon" data-icon="paperclip"></i></button>
        <div class="input-field-wrap glass" id="inputFieldWrap">
          <div class="input-field" id="messageInput" contenteditable="true" data-placeholder="Сообщение" role="textbox" aria-label="Сообщение"></div>
          <div class="recording-ui" id="recordingUI" hidden>
            <span class="recording-dot"></span>
            <span class="recording-timer" id="recordingTimer">0:00</span>
            <span class="recording-hint"><i class="icon" data-icon="chevronLeft"></i>Слайд для отмены</span>
          </div>
        </div>
        <button class="glass-circle-btn input-send" id="sendBtn" aria-label="Отправить">
          <i class="icon" id="sendBtnIcon" data-icon="mic"></i>
        </button>
      </div>
    </section>

    <!-- ---- Contact profile ---- -->
    <section class="screen" id="screen-profile-contact" data-screen="profile-contact">
      <header class="navbar navbar--plain">
        <button class="nav-btn nav-side nav-side--left" data-action="pop"><i class="icon" data-icon="chevronLeft"></i><span>Назад</span></button>
        <h1 class="navbar-title">Профиль</h1>
        <span class="nav-side nav-side--right"></span>
      </header>
      <div class="scroll-area">
        <div class="profile-header">
          <span class="avatar avatar--xl" id="contactProfileAvatar"></span>
          <h2 class="profile-name" id="contactProfileName"></h2>
          <p class="profile-status" id="contactProfileStatus"></p>
        </div>

        <div class="profile-actions-row">
          <button class="profile-action-btn" data-action="call-audio">
            <span class="profile-action-icon"><i class="icon" data-icon="phone"></i></span><span>Аудио</span>
          </button>
          <button class="profile-action-btn" data-action="call-video">
            <span class="profile-action-icon"><i class="icon" data-icon="video"></i></span><span>Видео</span>
          </button>
          <button class="profile-action-btn" id="contactMuteBtn">
            <span class="profile-action-icon"><i class="icon" data-icon="bellSlash"></i></span><span id="contactMuteLabel">Без звука</span>
          </button>
          <button class="profile-action-btn" data-action="search-in-chat">
            <span class="profile-action-icon"><i class="icon" data-icon="search"></i></span><span>Поиск</span>
          </button>
        </div>

        <div class="glass-card track-card" id="contactTrackCard">
          <span class="track-art"><i class="icon" data-icon="music"></i></span>
          <span class="track-info">
            <span class="track-title" id="contactTrackTitle"></span>
            <span class="track-artist" id="contactTrackArtist"></span>
          </span>
          <button class="track-play"><i class="icon" data-icon="play"></i></button>
        </div>

        <div class="glass-card info-card">
          <div class="info-row"><span class="info-label">Телефон</span><span class="info-value" id="cPhone"></span></div>
          <div class="info-row"><span class="info-label">Тег</span><span class="info-value" id="cTag"></span></div>
          <div class="info-row"><span class="info-label">Дата рождения</span><span class="info-value" id="cBirthday"></span></div>
          <div class="info-row info-row--multiline"><span class="info-label">О себе</span><span class="info-value" id="cBio"></span></div>
        </div>

        <div class="media-section">
          <div class="media-section-header"><span>Медиа, файлы и ссылки</span><span class="media-count" id="mediaCount"></span></div>
          <div class="media-grid" id="mediaGrid"></div>
        </div>
      </div>
    </section>

  </div>
</div>

<!-- ======================= NEW CHAT SHEET ======================= -->
<div class="sheet-overlay" id="newChatOverlay">
  <div class="sheet glass" id="newChatSheet">
    <div class="sheet-grabber"></div>
    <header class="sheet-header">
      <button class="text-btn nav-side nav-side--left" id="newChatCancelBtn">Отмена</button>
      <h2 class="sheet-title">Новый чат</h2>
      <span class="nav-side nav-side--right"></span>
    </header>
    <div class="search-wrap search-wrap--sheet">
      <div class="search-bar glass">
        <i class="icon search-icon" data-icon="search"></i>
        <input type="text" id="newChatSearchInput" class="search-input" placeholder="Поиск" autocomplete="off">
      </div>
    </div>
    <div class="scroll-area sheet-scroll">
      <div class="new-chat-actions">
        <button class="action-row">
          <span class="settings-icon settings-icon--green"><i class="icon" data-icon="personPlus"></i></span>
          <span class="settings-row-label">Добавить контакт</span>
        </button>
        <button class="action-row">
          <span class="settings-icon settings-icon--blue"><i class="icon" data-icon="megaphone"></i></span>
          <span class="settings-row-label">Создать канал</span>
        </button>
        <button class="action-row">
          <span class="settings-icon settings-icon--purple"><i class="icon" data-icon="people"></i></span>
          <span class="settings-row-label">Создать группу</span>
        </button>
      </div>
      <p class="section-label">Контакты</p>
      <div class="contact-list glass-card" id="newChatContactList"></div>
    </div>
  </div>
</div>

<!-- ======================= CHAT PREVIEW (long press) ======================= -->
<div class="modal-overlay" id="previewOverlay">
  <div class="preview-wrap">
    <div class="preview-card glass" id="previewCard">
      <div class="preview-topbar">
        <button class="text-btn" id="previewCloseBtn">Отмена</button>
        <span class="preview-name" id="previewName"></span>
        <span class="nav-side nav-side--right"></span>
      </div>
      <div class="preview-messages" id="previewMessages"></div>
    </div>
    <div class="preview-actions glass" id="previewActions">
      <button class="preview-action-btn" id="previewArchiveBtn"><i class="icon" data-icon="archive"></i><span>Архивировать</span></button>
      <span class="preview-actions-divider"></span>
      <button class="preview-action-btn" id="previewPinBtn"><i class="icon" data-icon="pin"></i><span id="previewPinLabel">Закрепить</span></button>
    </div>
  </div>
</div>

<!-- ======================= AVATAR PREVIEW ======================= -->
<div class="modal-overlay modal-overlay--avatar" id="avatarPreviewOverlay">
  <button class="text-btn avatar-preview-close" id="avatarPreviewCloseBtn">Отмена</button>
  <div class="avatar-preview-square" id="avatarPreviewSquare"></div>
</div>

<div class="toast" id="toast"></div>

<script src="./script.js"></script>
</body>
</html>
