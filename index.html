<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Minimal Liquid Glass Messenger</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="app-layout">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__nav" id="sidebarNav">
      <div class="sidebar__nav-row">
        <button class="avatar-btn" onclick="toggleSettings(true)" aria-label="Настройки">
          <div class="avatar avatar--sm avatar--me">М</div>
        </button>
        <h1 class="sidebar__big-title" id="bigTitle">Чаты</h1>
        <button class="btn btn--icon btn--glass" onclick="toggleNewChat(true)" aria-label="Новый чат">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

      <!-- Поиск -->
      <div class="search-row" id="searchRow">
        <button class="search-cancel" id="searchCancelBtn" onclick="exitSearch()">Отмена</button>
        <div class="search-field liquid-glass" id="searchField">
          <svg class="search-field__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7.2"/><path d="m21 21-4.4-4.4"/></svg>
          <input
            type="text"
            id="searchInput"
            placeholder="Поиск"
            class="search-field__input is-empty"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false">
          <button class="search-field__clear is-hidden" id="searchClearBtn" aria-label="Очистить">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm3.6 12.2-1.4 1.4L12 13.4l-2.2 2.2-1.4-1.4L10.6 12 8.4 9.8l1.4-1.4L12 10.6l2.2-2.2 1.4 1.4L13.4 12l2.2 2.2Z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Список чатов -->
    <ul class="sidebar__list" id="chatList"></ul>

    <!-- Состояние поиска -->
    <div class="search-state is-hidden liquid-glass-panel" id="searchState">
      <div class="search-section" id="recentSearchSection">
        <div class="search-section__head">
          <span>Недавнее</span>
          <button class="link-btn" id="clearRecentBtn" onclick="clearRecentSearches()">Очистить</button>
        </div>
        <ul class="sidebar__list sidebar__list--flush" id="recentSearchList"></ul>
      </div>
      <ul class="sidebar__list sidebar__list--flush is-hidden" id="searchResultsList"></ul>
      <div class="search-empty is-hidden" id="searchEmptyState">
        <p>Ничего не найдено</p>
      </div>
    </div>
  </aside>

  <!-- ============ CHAT VIEW ============ -->
  <main class="chat-view is-hidden" id="chatView">
    <div class="chat-empty" id="chatEmptyState">
      <p>Выберите чат</p>
    </div>

    <div class="chat-content is-hidden" id="chatContent">
      <header class="chat-view__header liquid-glass-panel">
        <div class="header__left">
          <button class="btn btn--text" onclick="closeChat()">Назад</button>
        </div>
        <button class="header__center" onclick="toggleProfile(true)">
          <div class="chat-view__title" id="headerName"></div>
          <div class="chat-view__subtitle" id="headerStatus"></div>
        </button>
        <div class="header__right">
          <button class="avatar-btn" onclick="openAvatarPreview()">
            <div class="avatar avatar--sm" id="headerAvatarMobile"></div>
          </button>
        </div>
      </header>

      <div class="messages" id="messagesArea"></div>

      <div class="composer-wrapper">
        <!-- Оверлей записи кружка -->
        <div class="record-overlay liquid-glass" id="recordOverlay">
          <div class="camera-preview-circle">
            <video id="cameraFeed" autoplay muted playsinline></video>
            <div class="record-indicator"></div>
          </div>
          <div class="record-controls">
            <button class="btn btn--icon liquid-glass" id="flipCameraBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2.1l4 4-4 4"/><path d="M3 12.2v-2a4 4 0 0 1 4-4h13M7 21.9l-4-4 4-4"/><path d="M21 11.8v2a4 4 0 0 1-4 4H4"/></svg>
            </button>
            <span id="recordTimer">00:00</span>
            <div class="record-slide-cancel" id="slideCancelText">
               <span>Отмена</span>
            </div>
          </div>
        </div>

        <div class="composer" id="composerMain">
          <button class="btn btn--icon liquid-glass" aria-label="Файл">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          
          <div class="composer__input-wrapper liquid-glass">
            <textarea class="composer__input" id="messageInput" rows="1" placeholder="Сообщение..."></textarea>
          </div>

          <div class="action-btn-wrap">
            <button class="btn btn--icon btn--primary is-hidden liquid-glass" id="sendBtn" aria-label="Отправить">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </button>
            <button class="btn btn--icon media-btn liquid-glass" id="mediaBtn" aria-label="Медиа">
              <svg id="iconMic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
              <svg id="iconCam" class="is-hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="3"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ============ NEW CHAT FULLSCREEN ============ -->
  <div class="slide-panel slide-panel--bottom liquid-glass-panel" id="newChatPanel">
    <div class="slide-panel__header">
      <button class="btn btn--text" onclick="toggleNewChat(false)">Отмена</button>
      <span>Новый чат</span>
      <div class="header-spacer"></div>
    </div>
    <div class="search-field search-field--panel liquid-glass">
      <svg class="search-field__icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7.2"/><path d="m21 21-4.4-4.4"/></svg>
      <input type="text" class="search-field__input is-empty" placeholder="Поиск контактов">
    </div>
    <ul class="sidebar__list" id="globalContactList"></ul>
  </div>

  <!-- ============ SETTINGS ============ -->
  <div class="slide-panel slide-panel--right liquid-glass-panel" id="settingsPanel">
    <div class="slide-panel__header">
      <button class="btn btn--text" onclick="toggleSettings(false)">Назад</button>
      <span>Настройки</span>
      <div class="header-spacer"></div>
    </div>
    <div class="slide-panel__content" id="settingsContent"></div>
  </div>

  <!-- ============ PROFILE ============ -->
  <div class="slide-panel slide-panel--right liquid-glass-panel" id="profilePanel">
    <div class="slide-panel__header">
      <button class="btn btn--text" onclick="toggleProfile(false)">Назад</button>
      <span>Профиль</span>
      <div class="header-spacer"></div>
    </div>
    <div class="slide-panel__content" id="profileContent"></div>
  </div>

  <!-- ============ CONTEXT MENU (long-press) ============ -->
  <div class="ctx-scrim is-hidden" id="ctxScrim"></div>
  <div class="ctx-menu is-hidden liquid-glass" id="ctxMenu">
    <div class="ctx-menu__preview scrollable" id="ctxPreview"></div>
    <div class="ctx-menu__actions" id="ctxActions"></div>
  </div>

  <!-- ============ AVATAR PREVIEW ============ -->
  <div class="avatar-modal is-hidden" id="avatarModal" onclick="closeAvatarPreview()">
    <div class="avatar-modal__content">
      <div class="avatar avatar--giant" id="avatarModalContent"></div>
    </div>
  </div>

  <div class="toast is-hidden liquid-glass" id="toast"></div>

</div>
<script src="./script.js"></script>
</body>
</html>
