<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Сообщения</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div id="app" class="app-shell">

  <!-- ======================= SCREEN: CHAT LIST ======================= -->
  <section id="screen-chats" class="screen root-screen active" data-screen="chats">
    <header class="nav-bar">
      <button class="avatar-btn" id="openSettingsBtn" aria-label="Открыть настройки"></button>
      <h1 class="nav-title">Чаты</h1>
      <button class="glass-circle-btn accent" id="openNewChatBtn" aria-label="Новый чат">
        <svg viewBox="0 0 24 24" width="19" height="19"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>
      </button>
    </header>

    <div class="search-wrap">
      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="text" id="searchInput" placeholder="Поиск" autocomplete="off">
      </div>
    </div>

    <div class="chat-list" id="chatList"></div>
  </section>

  <!-- ======================= SCREEN: SINGLE CHAT ======================= -->
  <section id="screen-chat" class="screen" data-screen="chat">
    <header class="nav-bar chat-header">
      <button class="text-btn back-btn" data-action="back">
        <svg viewBox="0 0 24 24" width="12" height="20"><path d="M15 3L6 12l9 9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        <span>Назад</span>
      </button>
      <button class="chat-header-center" id="chatHeaderInfo">
        <span class="chat-name" id="chatHeaderName">Имя</span>
        <span class="chat-status" id="chatHeaderStatus">в сети</span>
      </button>
      <button class="chat-header-avatar" id="chatHeaderAvatar" aria-label="Профиль"></button>
    </header>

    <div class="messages-scroll" id="messagesList"></div>

    <div class="typing-indicator" id="typingIndicator" hidden>
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>

    <div class="input-bar">
      <button class="glass-circle-btn small" id="attachBtn" aria-label="Прикрепить">
        <svg viewBox="0 0 24 24" width="17" height="17"><path d="M20.5 12.5l-8.4 8.4a4.8 4.8 0 01-6.8-6.8l9-9a3.2 3.2 0 014.6 4.6l-8.9 8.9a1.6 1.6 0 01-2.3-2.3l7.9-7.9" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="input-field-wrap">
        <textarea id="messageInput" placeholder="iMessage" rows="1"></textarea>
        <button class="camera-inline-btn" id="cameraInlineBtn" aria-label="Камера">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M4 8.5A1.5 1.5 0 015.5 7H8l1.1-1.6a1 1 0 01.83-.4h4.14a1 1 0 01.83.4L15.9 7h2.6A1.5 1.5 0 0120 8.5v9A1.5 1.5 0 0118.5 19h-13A1.5 1.5 0 014 17.5v-9z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
        </button>
      </div>

      <button class="send-btn" id="sendBtn" aria-label="Отправить">
        <svg class="icon-mic" viewBox="0 0 24 24" width="18" height="18"><rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M6 11a6 6 0 0012 0M12 19v2" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>
        <svg class="icon-camera" viewBox="0 0 24 24" width="18" height="18" hidden><path d="M4 8.5A1.5 1.5 0 015.5 7H8l1.1-1.6a1 1 0 01.83-.4h4.14a1 1 0 01.83.4L15.9 7h2.6A1.5 1.5 0 0120 8.5v9A1.5 1.5 0 0118.5 19h-13A1.5 1.5 0 014 17.5v-9z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
        <svg class="icon-send" viewBox="0 0 24 24" width="17" height="17" hidden><path d="M12 19V5M12 5l-6 6M12 5l6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
    </div>

    <div class="voice-record-overlay" id="voiceRecordOverlay" hidden>
      <div class="voice-record-bar">
        <div class="rec-dot"></div>
        <span class="rec-time" id="recTime">0:00</span>
        <div class="rec-wave"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <span class="rec-hint">◀ Проведите для отмены</span>
      </div>
    </div>
  </section>

  <!-- ======================= SCREEN: CONTACT PROFILE ======================= -->
  <section id="screen-contact-profile" class="screen" data-screen="contact-profile">
    <header class="nav-bar">
      <button class="text-btn back-btn" data-action="back">
        <svg viewBox="0 0 24 24" width="12" height="20"><path d="M15 3L6 12l9 9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        <span>Назад</span>
      </button>
      <h1 class="nav-title">Профиль</h1>
      <span class="nav-spacer"></span>
    </header>
    <div class="scroll-area profile-scroll" id="contactProfileBody"></div>
  </section>

  <!-- ======================= SCREEN: SETTINGS ======================= -->
  <section id="screen-settings" class="screen" data-screen="settings">
    <header class="nav-bar">
      <button class="text-btn back-btn" data-action="back">
        <svg viewBox="0 0 24 24" width="12" height="20"><path d="M15 3L6 12l9 9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        <span>Назад</span>
      </button>
      <h1 class="nav-title">Настройки</h1>
      <span class="nav-spacer"></span>
    </header>
    <div class="scroll-area" id="settingsBody">
      <div class="glass-card settings-profile-card" id="settingsProfileCard" data-action="open-own-profile">
        <div class="avatar-lg" id="settingsAvatar"></div>
        <div class="settings-profile-info">
          <div class="settings-profile-name" id="settingsName">Антон Волков</div>
          <div class="settings-profile-tag" id="settingsTag">@anton</div>
        </div>
        <svg class="chevron" viewBox="0 0 24 24" width="10" height="17"><path d="M2 2l8 8-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </div>

      <div class="glass-card settings-list">
        <button class="settings-row" data-action="open-settings-detail" data-title="Конфиденциальность">
          <span class="settings-icon" style="background:#8E8E93">🔒</span><span>Конфиденциальность</span><svg class="chevron" viewBox="0 0 24 24" width="9" height="15"><path d="M2 2l8 8-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <button class="settings-row" data-action="open-settings-detail" data-title="Уведомления">
          <span class="settings-icon" style="background:#FF453A">🔔</span><span>Уведомления</span><svg class="chevron" viewBox="0 0 24 24" width="9" height="15"><path d="M2 2l8 8-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <button class="settings-row" data-action="open-settings-detail" data-title="Устройства">
          <span class="settings-icon" style="background:#0A84FF">💻</span><span>Устройства</span><svg class="chevron" viewBox="0 0 24 24" width="9" height="15"><path d="M2 2l8 8-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <button class="settings-row" data-action="open-settings-detail" data-title="Данные">
          <span class="settings-icon" style="background:#30D158">📊</span><span>Данные</span><svg class="chevron" viewBox="0 0 24 24" width="9" height="15"><path d="M2 2l8 8-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
      </div>

      <div class="glass-card settings-list">
        <button class="settings-row" data-action="open-settings-detail" data-title="Оформление">
          <span class="settings-icon" style="background:#5E5CE6">🎨</span><span>Оформление</span><svg class="chevron" viewBox="0 0 24 24" width="9" height="15"><path d="M2 2l8 8-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <button class="settings-row" data-action="open-settings-detail" data-title="Группировка чатов">
          <span class="settings-icon" style="background:#FF9F0A">🗂️</span><span>Группировка чатов</span><svg class="chevron" viewBox="0 0 24 24" width="9" height="15"><path d="M2 2l8 8-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <button class="settings-row" data-action="open-settings-detail" data-title="Язык">
          <span class="settings-icon" style="background:#64D2FF">🌐</span><span>Язык</span><svg class="chevron" viewBox="0 0 24 24" width="9" height="15"><path d="M2 2l8 8-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
      </div>

      <div class="glass-card settings-list">
        <button class="settings-row" data-action="open-settings-detail" data-title="Поддержка">
          <span class="settings-icon" style="background:#8E8E93">💬</span><span>Поддержка</span><svg class="chevron" viewBox="0 0 24 24" width="9" height="15"><path d="M2 2l8 8-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <button class="settings-row" data-action="open-settings-detail" data-title="О приложении">
          <span class="settings-icon" style="background:#8E8E93">ℹ️</span><span>О приложении</span><svg class="chevron" viewBox="0 0 24 24" width="9" height="15"><path d="M2 2l8 8-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- ======================= SCREEN: SETTINGS DETAIL (generic) ======================= -->
  <section id="screen-settings-detail" class="screen" data-screen="settings-detail">
    <header class="nav-bar">
      <button class="text-btn back-btn" data-action="back">
        <svg viewBox="0 0 24 24" width="12" height="20"><path d="M15 3L6 12l9 9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        <span>Назад</span>
      </button>
      <h1 class="nav-title" id="settingsDetailTitle">Раздел</h1>
      <span class="nav-spacer"></span>
    </header>
    <div class="scroll-area" id="settingsDetailBody"></div>
  </section>

  <!-- ======================= SCREEN: OWN PROFILE ======================= -->
  <section id="screen-own-profile" class="screen" data-screen="own-profile">
    <header class="nav-bar">
      <button class="text-btn back-btn" data-action="back">
        <svg viewBox="0 0 24 24" width="12" height="20"><path d="M15 3L6 12l9 9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        <span>Назад</span>
      </button>
      <h1 class="nav-title">Мой профиль</h1>
      <button class="text-btn accent-text" data-action="open-edit-profile">Изменить</button>
    </header>
    <div class="scroll-area profile-scroll" id="ownProfileBody"></div>
  </section>

  <!-- ======================= SCREEN: EDIT PROFILE ======================= -->
  <section id="screen-edit-profile" class="screen" data-screen="edit-profile">
    <header class="nav-bar">
      <button class="text-btn back-btn" data-action="back">Отмена</button>
      <h1 class="nav-title">Изменить профиль</h1>
      <button class="text-btn accent-text" data-action="save-profile">Готово</button>
    </header>
    <div class="scroll-area" id="editProfileBody"></div>
  </section>

  <!-- ======================= DESKTOP EMPTY STATE ======================= -->
  <div class="desktop-placeholder" id="desktopPlaceholder">
    <div class="glyph">💬</div>
    <p>Выберите чат слева, чтобы начать переписку</p>
  </div>

  <!-- ======================= NEW CHAT SHEET ======================= -->
  <div class="sheet-overlay" id="newChatOverlay">
    <div class="sheet" id="newChatSheet">
      <div class="sheet-grabber"></div>
      <header class="nav-bar sheet-header">
        <button class="text-btn" data-action="close-sheet">Отмена</button>
        <h1 class="nav-title">Новый чат</h1>
        <span class="nav-spacer"></span>
      </header>
      <div class="search-wrap">
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="text" id="newChatSearch" placeholder="Поиск">
        </div>
      </div>
      <div class="new-chat-actions">
        <button class="action-row" data-action="add-contact">
          <span class="action-icon" style="background:#30D158">＋</span><span>Добавить контакт</span>
        </button>
        <button class="action-row" data-action="create-channel">
          <span class="action-icon" style="background:#0A84FF">📣</span><span>Создать канал</span>
        </button>
        <button class="action-row" data-action="create-group">
          <span class="action-icon" style="background:#5E5CE6">👥</span><span>Создать группу</span>
        </button>
      </div>
      <div class="scroll-area" id="newChatContactList"></div>
    </div>
  </div>

  <!-- ======================= ADD CONTACT SHEET ======================= -->
  <div class="sheet-overlay" id="addContactOverlay">
    <div class="sheet small-sheet">
      <div class="sheet-grabber"></div>
      <header class="nav-bar sheet-header">
        <button class="text-btn" data-action="close-inner-sheet">Отмена</button>
        <h1 class="nav-title">Новый контакт</h1>
        <button class="text-btn accent-text" data-action="save-contact">Готово</button>
      </header>
      <div class="scroll-area">
        <div class="glass-card form-card">
          <label class="form-row"><span>Имя</span><input type="text" id="newContactName" placeholder="Введите имя"></label>
          <label class="form-row"><span>Телефон</span><input type="text" id="newContactPhone" placeholder="+7 ___ ___-__-__"></label>
        </div>
      </div>
    </div>
  </div>

  <!-- ======================= CREATE GROUP / CHANNEL SHEET ======================= -->
  <div class="sheet-overlay" id="createGroupOverlay">
    <div class="sheet" id="createGroupSheet">
      <div class="sheet-grabber"></div>
      <header class="nav-bar sheet-header">
        <button class="text-btn" data-action="close-inner-sheet">Отмена</button>
        <h1 class="nav-title" id="createGroupTitle">Новая группа</h1>
        <button class="text-btn accent-text" id="groupNextBtn" data-action="group-next">Далее</button>
      </header>
      <div id="groupStepSelect">
        <div class="search-wrap">
          <div class="search-bar">
            <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input type="text" placeholder="Поиск участников">
          </div>
        </div>
        <div class="scroll-area" id="groupContactList"></div>
      </div>
      <div id="groupStepDetails" hidden>
        <div class="group-photo-picker">
          <div class="avatar-lg avatar-picker" id="groupAvatarPreview">📷</div>
        </div>
        <div class="glass-card form-card">
          <label class="form-row"><span>Название</span><input type="text" id="groupNameInput" placeholder="Введите название"></label>
        </div>
      </div>
    </div>
  </div>

  <!-- ======================= CHAT PREVIEW (LONG PRESS) ======================= -->
  <div class="preview-overlay" id="previewOverlay">
    <div class="preview-wrap">
      <div class="preview-card" id="previewCard"></div>
      <div class="preview-actions">
        <button class="preview-action-btn" data-action="archive-preview">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M6 7v11a2 2 0 002 2h8a2 2 0 002-2V7M9 11h6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M3 4h18v3H3z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>
          <span>Архивировать</span>
        </button>
        <button class="preview-action-btn" data-action="pin-preview">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 2l1.5 5.5L19 9l-4.5 3.5L16 18l-4-3.2L8 18l1.5-5.5L5 9l5.5-1.5z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>
          <span>Закрепить</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ======================= AVATAR ZOOM OVERLAY ======================= -->
  <div class="avatar-zoom-overlay" id="avatarZoomOverlay">
    <div class="avatar-zoom-box" id="avatarZoomBox"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

</div>

<script src="./script.js"></script>
</body>
</html>
