<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Messages — iOS 26</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="app-layout">
  <!-- БОКОВАЯ ПАНЕЛЬ (СПИСОК ЧАТОВ) -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__nav" id="sidebarNav">
      <div class="sidebar__nav-row">
        <button class="avatar-btn" onclick="toggleSettings(true)" aria-label="Настройки">
          <div class="avatar avatar--sm avatar--me">М</div>
        </button>
        <h1 class="sidebar__big-title">Чаты</h1>
        <button class="btn btn--icon btn--glass" onclick="toggleNewChat(true)" aria-label="Новый чат">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

      <div class="search-row" id="searchRow">
        <button class="search-cancel" id="searchCancelBtn" onclick="exitSearch()">Отмена</button>
        <div class="search-field" id="searchField">
          <svg class="search-field__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7.2"/><path d="m21 21-4.4-4.4"/></svg>
          <input type="text" id="searchInput" placeholder="Поиск" class="search-field__input is-empty" autocomplete="off">
          <button class="search-field__clear is-hidden" id="searchClearBtn" aria-label="Очистить">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm3.6 12.2-1.4 1.4L12 13.4l-2.2 2.2-1.4-1.4L10.6 12 8.4 9.8l1.4-1.4L12 10.6l2.2-2.2 1.4 1.4L13.4 12l2.2 2.2Z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <ul class="sidebar__list" id="chatList"></ul>

    <div class="search-state is-hidden" id="searchState">
      <div class="search-section" id="recentSearchSection">
        <div class="search-section__head">
          <span>Недавнее</span>
          <button class="link-btn" id="clearRecentBtn" onclick="clearRecentSearches()">Очистить</button>
        </div>
        <ul class="sidebar__list sidebar__list--flush" id="recentSearchList"></ul>
      </div>
      <ul class="sidebar__list sidebar__list--flush is-hidden" id="searchResultsList"></ul>
      <div class="search-empty is-hidden" id="searchEmptyState">
        <p>Ничего не найдено</p>
      </div>
    </div>
  </aside>

  <!-- ОКНО ЧАТА -->
  <main class="chat-view is-hidden" id="chatView">
    <div class="chat-content is-hidden" id="chatContent">
      <header class="chat-view__header glass-panel">
        <div class="header__left">
          <button class="btn btn--text" onclick="closeChat()">‹ Назад</button>
        </div>
        <button class="header__center" onclick="toggleProfile(true)">
          <div class="chat-view__title" id="headerName"></div>
          <div class="chat-view__subtitle" id="headerStatus"></div>
        </button>
        <div class="header__right">
          <button class="avatar-btn" onclick="openAvatarPreview()">
            <div class="avatar avatar--sm" id="headerAvatarMobile"></div>
          </button>
        </div>
      </header>

      <div class="messages" id="messagesArea"></div>

      <!-- iOS 26 Separated Liquid Glass Composer -->
      <div class="composer-wrapper">
        <div class="composer-island">
          <button class="composer-btn glass-element" id="attachBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          
          <div class="composer-input-wrapper glass-element">
            <textarea id="messageInput" class="composer__input" placeholder="Сообщение..." rows="1"></textarea>
          </div>
          
          <button class="composer-btn glass-element" id="mediaBtn">
            <svg id="iconMic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
            <svg id="iconCam" class="is-hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="3"/></svg>
          </button>
          <button class="composer-btn btn--primary is-hidden" id="sendBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          </button>
        </div>

        <div class="record-overlay glass-element" id="recordOverlay">
          <div class="record-indicator"><div class="record-dot"></div><span id="recordTimer">00:00</span></div>
          <div class="record-slide-cancel" id="slideCancelText">‹ Свайп для отмены</div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Модальные окна и панели -->
<div class="sheet-scrim is-hidden" id="settingsScrim" onclick="toggleSettings(false)"></div>
<div class="slide-panel full-screen-panel" id="settingsPanel">
  <div class="slide-panel__header glass-panel">
    <button class="btn btn--text" onclick="toggleSettings(false)">‹ Назад</button>
    <span>Настройки</span>
    <div style="width: 60px;"></div>
  </div>
  <div class="slide-panel__content" id="settingsContent"></div>
</div>

<div class="sheet-scrim is-hidden" id="profileScrim" onclick="toggleProfile(false)"></div>
<div class="slide-panel slide-panel--right" id="profilePanel">
  <div class="slide-panel__header glass-panel">
    <button class="btn btn--text" onclick="toggleProfile(false)">‹ Назад</button>
    <span>Профиль</span>
    <div style="width: 60px;"></div>
  </div>
  <div class="slide-panel__content" id="profileContent"></div>
</div>

<div class="sheet-scrim is-hidden" id="newChatScrim" onclick="toggleNewChat(false)"></div>
<div class="slide-panel full-screen-panel" id="newChatPanel">
  <div class="slide-panel__header glass-panel">
    <button class="btn btn--text" onclick="toggleNewChat(false)">‹ Назад</button>
    <span>Новый чат</span>
    <div style="width: 60px;"></div>
  </div>
  <div class="slide-panel__content">
    <ul class="sidebar__list" id="globalContactList"></ul>
  </div>
</div>

<!-- Видоискатель кружочка -->
<div class="video-record-ui is-hidden" id="videoRecordUI">
  <div class="video-circle-preview">
    <div class="video-circle-feed"></div> <!-- Заглушка под камеру -->
  </div>
  <button class="glass-element flip-cam-btn" onclick="showToast('Камера перевернута')">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l3-3 3 3"/><path d="M6 6v12a3 3 0 0 0 3 3h4"/><path d="M21 15l-3 3-3-3"/><path d="M18 18V6a3 3 0 0 0-3-3h-4"/></svg>
  </button>
</div>

<div class="toast" id="toast"></div>

<!-- Контекстное меню -->
<div class="ctx-scrim is-hidden" id="ctxScrim"></div>
<div class="ctx-menu is-hidden" id="ctxMenu">
  <div class="ctx-menu__preview" id="ctxPreview"></div>
  <div class="ctx-menu__actions" id="ctxActions"></div>
</div>

<!-- Просмотр аватарки -->
<div class="avatar-preview-scrim is-hidden" id="avatarPreviewOverlay" onclick="closeAvatarPreview()">
  <div class="avatar-preview-container" id="avatarPreviewContainer"></div>
</div>

<script src="./script.js"></script>
</body>
</html>
