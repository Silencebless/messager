<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OLED Messenger — Apple Edition</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="app-layout">
  
  <!-- SIDEBAR: Список чатов -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__header">
      <div class="avatar avatar--sm cursor-pointer" onclick="toggleSettings(true)" style="background: var(--accent);" title="Настройки">М</div>
      <span class="sidebar__title">Messages</span>
      <button class="btn btn--icon btn--circle" onclick="toggleNewChat(true)" aria-label="Новый чат">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <div class="sidebar__search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Поиск" class="sidebar__search-input">
    </div>

    <ul class="sidebar__list" id="chatList"></ul>
  </aside>

  <!-- CHAT VIEW: Активный диалог -->
  <main class="chat-view is-hidden" id="chatView">
    
    <!-- Заглушка для ПК, если чат не выбран -->
    <div class="chat-empty" id="chatEmptyState">
      <div class="chat-empty__badge">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <p>Выберите чат для отправки сообщений</p>
    </div>

    <!-- Контент активного чата -->
    <div class="chat-content is-hidden" id="chatContent">
      <header class="chat-view__header">
        
        <!-- Левая часть: Стрелка назад (мобилки) / Аватар (ПК) -->
        <div class="header__left">
          <button class="btn btn--icon mobile-only" onclick="closeChat()" aria-label="Назад">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="avatar avatar--sm desktop-only cursor-pointer" onclick="toggleProfile(true)" id="headerAvatarDesktop"></div>
        </div>

        <!-- Центр: Имя и статус -->
        <div class="header__center cursor-pointer" onclick="toggleProfile(true)">
          <div class="chat-view__title" id="headerName"></div>
          <div class="chat-view__subtitle" id="headerStatus"></div>
        </div>

        <!-- Правая часть: Звонок/Поиск (ПК) / Аватар (мобилки) -->
        <div class="header__right">
          <button class="btn btn--icon desktop-only" aria-label="Звонок">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </button>
          <button class="btn btn--icon desktop-only" aria-label="Поиск">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </button>
          <div class="avatar avatar--sm mobile-only cursor-pointer" onclick="toggleProfile(true)" id="headerAvatarMobile"></div>
        </div>
      </header>

      <div class="messages" id="messagesArea"></div>

      <!-- КОМПОЗЕР И СИСТЕМА ЗАПИСИ МЕДИА -->
      <div class="composer-wrapper">
        <div class="record-overlay" id="recordOverlay">
          <div class="record-indicator">
            <div class="record-dot"></div>
            <span id="recordTimer">00:00</span>
          </div>
          <div class="record-slide-cancel" id="slideCancelText">
            <span>&lt; Свайп для отмены</span>
          </div>
        </div>

        <div class="composer" id="composerMain">
          <button class="btn btn--icon" aria-label="Файл">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <textarea class="composer__input" id="messageInput" rows="1" placeholder="Сообщение..."></textarea>
          
          <div class="action-btn-wrap">
            <button class="btn btn--icon btn--primary is-hidden" id="sendBtn" aria-label="Отправить">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </button>
            <button class="btn btn--icon media-btn" id="mediaBtn" aria-label="Медиа">
              <svg id="iconMic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
              <svg id="iconCam" class="is-hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ШИТЫ / ПАНЕЛИ -->
  <div class="slide-panel slide-panel--bottom" id="newChatPanel">
    <div class="slide-panel__header">
      <button class="btn btn--ghost" onclick="toggleNewChat(false)">Отмена</button>
      <span>Новый чат</span>
      <div style="width: 50px;"></div>
    </div>
    <div class="sidebar__search" style="margin: 16px;">
      <input type="text" class="sidebar__search-input" placeholder="Поиск контактов...">
    </div>
    <ul class="sidebar__list" id="globalContactList"></ul>
  </div>

  <div class="slide-panel" id="settingsPanel">
    <div class="slide-panel__header">
      <button class="btn btn--icon" onclick="toggleSettings(false)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <span>Настройки</span>
      <div style="width: 40px;"></div>
    </div>
    <div class="slide-panel__content">
      <div class="profile-hero">
        <div class="avatar avatar--xl" style="background: var(--accent);">М</div>
        <h2>Maxim</h2>
        <p class="text-secondary">+7 (999) 000-00-00</p>
      </div>
      <div class="settings-group">
        <div class="settings-item">
          <span>Уведомления</span>
          <label class="toggle-switch"><input type="checkbox" checked><span class="slider"></span></label>
        </div>
        <div class="settings-item">
          <span>Face ID / Touch ID</span>
          <label class="toggle-switch"><input type="checkbox"><span class="slider"></span></label>
        </div>
      </div>
    </div>
  </div>

  <div class="slide-panel slide-panel--right" id="profilePanel">
    <div class="slide-panel__header">
      <button class="btn btn--icon" onclick="toggleProfile(false)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <span>Профиль</span>
      <div style="width: 40px;"></div>
    </div>
    <div class="slide-panel__content" id="profileContent"></div>
  </div>

</div>
<script src="./script.js"></script>
</body>
</html>
